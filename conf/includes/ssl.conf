ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
ssl_prefer_server_ciphers on;
ssl_ciphers 'kEECDH+ECDSA+AES128 kEECDH+ECDSA+AES256 kEECDH+AES128 kEECDH+AES256 kEDH+AES128 kEDH+AES256 DES-CBC3-SHA +SHA !aNULL !eNULL !LOW !kECDH !DSS !MD5 !EXP !PSK !SRP !CAMELLIA !SEED';

# Diffie-Hellman parameter for DHE ciphersuites
ssl_dhparam           /etc/nginx/ssl/dhparams.pem;

# enable HSTS including subdomains
add_header Strict-Transport-Security "max-age=31536000;" always;

# allow Nginx to send OCSP results during the connection process
ssl_stapling off;
ssl_stapling_verify off;

# Cache SSL Sessions for up to 10 minutes
# This improves performance by avoiding the costly session negotiation process where possible
ssl_session_cache  builtin:1000  shared:SSL:10m;

# Criei um intermediate "cat DigiCertCA.crt TrustedRoot.crt > intermediate.crt"
# Depois criei um chained "cat certificate.crt intermediate.crt > chained.crt"
# Utilizei o chained.crt como certificado e comentei a linha intermediate.pem pois no mobile nao estava funcionando
# Fonte: https://www.organicadigital.com/blog/configurando-ssl-com-nginx/

ssl_certificate           /etc/nginx/ssl/certs/chained.crt;
ssl_certificate_key       /etc/nginx/ssl/certs/private.key;
#ssl_trusted_certificate   /etc/nginx/ssl/certs/intermediate.pem;
