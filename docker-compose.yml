version: "3.8"

networks:
  proxy_default:
    name: ${NETWORK_NAME}
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
          gateway: ${NETWORK_GATEWAY}

services:
  server:
    container_name: proxy-reverse
    restart: always
    hostname: reverse
    networks:
      - proxy_default
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
